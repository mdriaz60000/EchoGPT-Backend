services:
  postgres:
    image: postgres:16
    container_name: echogpt-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: echogpt

    ports:
      - "5432:5432"

    volumes:
      - echogpt_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echogpt"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  echogpt_postgres_data: